<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Add page</title>
</head>

<body class="bg-dark text-white">
    <form action="/add" method="post" class="vh-80">
        {% csrf_token %}
        <div class="mb-3 Container w-75 mx-auto my-5">
            <h1>Add new code</h1>
            <input name="title" type="text" class="form-control" placeholder="Write heading...">
        </div>
        <div class="form-floating Container w-75 mx-auto h-50">
            <textarea name="code" class="form-control" placeholder="Leave a comment here" id="floatingTextarea2"
                style="height: 300px"></textarea>
            <label for="floatingTextarea2" class="text-secondary">Write your Code here</label>
        </div>
        <div class="Container mt-3 d-flex justify-content-center">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
