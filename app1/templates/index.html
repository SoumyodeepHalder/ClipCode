<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Hello, world!</title>
    <style>
        /* Target your custom utility class */
        .hide-scrollbar {
            /* Modern standard way (Chrome 121+, Firefox 64+, Edge 121+, Safari 18.2+) */
            scrollbar-width: none;

            /* Legacy Support for Internet Explorer and Older Edge */
            -ms-overflow-style: none;
        }

        /* Legacy Support for older WebKit browsers (Chrome, Safari, Opera) */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="bg-dark text-white">
    <!-- parent -->
    <div class="container-fluid d-flex vh-100">
        <!-- sidebar -->
        <div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark border-end border-secondary"
            style="width: 280px;">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4">ClipCode</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link text-white">
                        DSA
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link active">
                        Django
                    </a>
                </li>
            </ul>
        </div>
        <!-- main content -->
        <div class="container-fluid h-100 overflow-auto">
            <div class="d-flex py-3 justify-content-end">
                <a class="btn btn-primary" href="{% url 'app1:addpage' %}">Add</a>
            </div>
            <div>
                <!-- Code Block Container -->
                {% for snippet in snippets %}
                <div class="position-relative bg-dark text-white rounded p-3 mb-2 border border-secondary">
                    <h5>{{snippet.title}}</h3>

                        <!-- Copy Button -->
                        <button class="btn btn-sm btn-outline-secondary position-absolute top-0 end-0 m-2" id="copyBtn"
                            onclick="copyCode()">Copy
                        </button>

                        <!-- Code Snippet -->
                        <pre class="m-0"><code id="codeBlock" class="text-info">{{snippet.code}}</code></pre>
                </div>
                {% empty %}
                <li>No records found.</li>
                {% endfor %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
